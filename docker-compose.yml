services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: audiobook
      POSTGRES_USER: app
      POSTGRESS_PASSWORD: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d audiobooks"]
      interval: 5s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/audiobooks
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: .env

  worker:
    build: .
    command: celery -A server.workers.celery_app worker --loglevel=info
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://app:app@postgres:5432/audiobooks
      SYNC_DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/audiobooks
    depends_on:
      redis: 
        condition: service_started
      postgres:
        condition: service_healthy
    env_file: .env
  
volumes:
  pgdata: