services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file: .env

  worker:
    build: .
    command: celery -A server.workers.celery_app worker --loglevel=info
    volumes:
      - .:/app
    depends_on:
      - redis
    env_file: .env